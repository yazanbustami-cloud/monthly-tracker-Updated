<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petra Ride · Demand & Growth Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#043CA1;--orange:#EC7C01;--indigo:#1D1B93;--brandeis:#0063F2;
  --red:#C70010;--green:#1C8E1C;--yellow:#FAC320;
  --white:#F9F9F9;--lg:#E3E2E9;--silver:#ABA9BC;--granite:#464555;--charcoal:#292935;
  --bg:#F9F9F9;--panel:#FFFFFF;--text:#292935;--muted:#464555;--line:#E3E2E9;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
body{font-variant-numeric:tabular-nums}
header{background:var(--blue);color:#fff;padding:18px 28px 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{font-weight:600;font-style:italic;font-size:22px;letter-spacing:.2px}
.brand small{display:block;font-style:normal;font-weight:500;font-size:13px;opacity:.8;margin-top:2px}
.fresh{text-align:right;font-size:12.5px;opacity:.92}
.fresh b{font-weight:700}
.fresh button{margin-left:10px;background:var(--orange);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:600 12px var(--font);cursor:pointer}
.fresh button:focus-visible,nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
nav{display:flex;gap:2px;margin-top:16px;overflow-x:auto}
nav button{background:transparent;color:#fff;opacity:.75;border:0;padding:11px 16px;font:600 13.5px var(--font);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{opacity:1}
nav button.on{opacity:1;border-bottom-color:var(--orange)}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red);font-size:11px;line-height:18px;text-align:center}
main{padding:22px 28px 60px;max-width:1500px;margin:0 auto}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:500}
.banner.warn{background:#FFF4E5;color:#8a4a00;border:1px solid #F6C58A}
.banner.err{background:#FDECEE;color:var(--red);border:1px solid #F2B8BE}
.banner.info{background:#EEF3FC;color:var(--blue);border:1px solid #C9D6F2}
h2{font-size:17px;font-weight:700;color:var(--blue);margin:28px 0 4px}
h2+.sep{height:2px;width:44px;background:var(--orange);margin:0 0 14px;border:0}
.sub{color:var(--muted);font-size:12.5px;margin:-8px 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}header,main{padding-left:14px;padding-right:14px}}
/* hero */
.hero{display:grid;grid-template-columns:320px 1fr;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero-l{background:var(--blue);color:#fff;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.hero-l .lbl{font-size:13px;opacity:.85;font-weight:500}
.hero-l .big{white-space:nowrap;font-size:54px;font-weight:800;line-height:1}
.hero-l .big span{font-size:17px;font-weight:600;opacity:.85;margin-left:4px}
.hero-l .row{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.22);padding-top:9px;font-size:13px}
.hero-l .row b{font-weight:700}
.hero-r{padding:16px 18px;min-height:320px;position:relative}
.chartbox{position:relative;height:280px}
.chartbox.sm{height:220px}
.chartbox.lg{height:340px}
/* kpi */
.kpi .k-l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .k-v{font-size:26px;font-weight:800;color:var(--charcoal);margin:4px 0 2px;line-height:1.1}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--lg);border-radius:3px;margin:9px 0 6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.st-g{color:var(--green)}.st-a{color:var(--orange)}.st-r{color:var(--red)}.st-n{color:var(--muted)}
.bg-g{background:var(--green)}.bg-a{background:var(--orange)}.bg-r{background:var(--red)}.bg-n{background:var(--silver)}.bg-b{background:var(--blue)}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:700;color:#fff}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-weight:700;color:var(--blue);padding:8px 10px;border-bottom:2px solid var(--blue);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.tot td{font-weight:800;border-top:2px solid var(--charcoal);border-bottom:0}
tr:hover td{background:#F4F6FB}
td.dim{color:var(--silver)}
.heat td{text-align:center;font-size:12px;padding:6px 4px;min-width:38px;color:#fff;font-weight:600}
.heat td:first-child{color:var(--text);text-align:left;font-weight:600;min-width:130px}
.heat th{text-align:center;font-size:11.5px;padding:6px 4px}
/* alerts */
.alert{display:grid;grid-template-columns:8px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 0;margin-bottom:8px;overflow:hidden}
.alert .sv{align-self:stretch;border-radius:0}
.alert .t{font-weight:700;font-size:14px}
.alert .d{color:var(--muted);font-size:12.8px;margin-top:2px}
.alert .n{font-size:20px;font-weight:800;text-align:right;padding-left:10px}
.alert .n small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.acat{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.acat button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font:600 12.5px var(--font);cursor:pointer;color:var(--charcoal)}
.acat button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.seg-h{display:flex;justify-content:space-between;align-items:baseline}
.seg-h h3{margin:0;font-size:15px;color:var(--blue)}
.mrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mrow:last-child{border-bottom:0}
.mrow b{font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.live-dot{animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}}
.sel{font:600 13px var(--font);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--charcoal)}
.sel:focus-visible,.acat button:focus-visible{outline:2px solid var(--brandeis);outline-offset:2px}
nav .navsep{flex:0 0 1px;background:rgba(255,255,255,.35);margin:9px 8px}
.hide,nav .badge.hide{display:none}
.loading{padding:60px;text-align:center;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Petra Ride<small id="subtitle">Demand & growth tracker</small></div>
    <div class="fresh"><span id="freshTxt">Loading data…</span><button id="refreshBtn" type="button">Refresh now</button></div>
  </div>
  <nav id="nav">
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="live">Today live</button>
    <button data-tab="hourly">Today hourly</button>
    <button data-tab="daily">Daily</button>
    <button data-tab="weekly">Weekly</button>
    <button data-tab="zones">Zones</button>
    <button data-tab="segments">User segments</button>
    <button data-tab="unis">Universities</button>
    <button data-tab="alerts">Alerts<span class="badge hide" id="alertBadge">0</span></button>
    <span class="navsep" aria-hidden="true"></span>
    <button data-tab="wow">Same time WoW</button>
    <button data-tab="periods">Day periods</button>
    <button data-tab="eta">ETA conversion</button>
    <button data-tab="unserved">Unserved</button>
    <button data-tab="ratings">Ratings</button>
    <button data-tab="payments">Visa &amp; Apple Pay</button>
    <button data-tab="churn">Churned</button>
    <button data-tab="risk">Churn risk</button>
    <button data-tab="promoroi">Promo ROI</button>
  </nav>
</header>
<main>
  <div id="banners"></div>
  <section id="tab-overview"><div class="loading">Loading targets and Metabase data…</div></section>
  <section id="tab-live" class="hide"></section>
  <section id="tab-hourly" class="hide"></section>
  <section id="tab-daily" class="hide"></section>
  <section id="tab-weekly" class="hide"></section>
  <section id="tab-zones" class="hide"></section>
  <section id="tab-segments" class="hide"></section>
  <section id="tab-unis" class="hide"></section>
  <section id="tab-alerts" class="hide"></section>
  <section id="tab-wow" class="hide"></section>
  <section id="tab-periods" class="hide"></section>
  <section id="tab-eta" class="hide"></section>
  <section id="tab-unserved" class="hide"></section>
  <section id="tab-ratings" class="hide"></section>
  <section id="tab-payments" class="hide"></section>
  <section id="tab-churn" class="hide"></section>
  <section id="tab-risk" class="hide"></section>
  <section id="tab-promoroi" class="hide"></section>
</main>
<script>
/* ============ CONFIG: edit data links here ============ */
const SOURCES = {
  segMonthly: 'https://analytics.riden.app/public/question/f05c4250-a418-4870-927b-5277d5e1b219.csv',
  zone:       'https://analytics.riden.app/public/question/cedc5e09-682a-4dd5-aefb-59863ab38904.csv',
  segDaily:   'https://analytics.riden.app/public/question/a7cf8c63-a5fe-4538-8022-ffd06559283a.csv',
  uni:        'https://analytics.riden.app/public/question/38977fbc-5e92-4921-99aa-d13e96996c3d.csv',
  funnel:     'https://analytics.riden.app/public/question/ea628db4-e363-472a-aa69-e65805d6af27.csv'
};
const TARGETS_FILE = 'Targets.xlsx';
const REFRESH_MS = 5 * 60 * 1000;
/* ====================================================== */

const QS = new URLSearchParams(location.search);
if (QS.get('src')) { const b = QS.get('src'); for (const k in SOURCES) SOURCES[k] = b + k + '.csv'; }
const TFILE = QS.get('targets') || TARGETS_FILE;
const SEGS = ['Active','Reactivated','New Registered','First Trip'];
const DOWN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const C = {blue:'#043CA1',orange:'#EC7C01',red:'#C70010',green:'#1C8E1C',silver:'#ABA9BC',lg:'#E3E2E9',indigo:'#1D1B93',brandeis:'#0063F2',granite:'#464555'};
let S = null, TAB = 'overview', ACAT = 'All', charts = {}, lastLoad = null, nextAt = null;

/* ---------- utils ---------- */
const norm = k => String(k||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const num = v => { if (typeof v === 'number') return isFinite(v)?v:0; if (v==null) return 0; const n = parseFloat(String(v).replace(/[,%\s]/g,'')); return isFinite(n)?n:0; };
const pad = n => String(n).padStart(2,'0');
function toISO(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  const s = String(v).trim(); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  const t = Date.parse(s); if (!isNaN(t)) { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  return null;
}
const dObj = s => new Date(s + 'T00:00:00Z');
const dow = s => dObj(s).getUTCDay();
const addDays = (s,n) => { const d = dObj(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const ammanToday = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Amman',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const ammanTime = () => new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Amman',hour:'2-digit',minute:'2-digit'}).format(new Date());
const fI = n => (n==null||!isFinite(n)) ? '–' : Math.round(n).toLocaleString('en-US');
const fJ = (n,d=0) => (n==null||!isFinite(n)) ? '–' : n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fP = (n,d=1) => (n==null||!isFinite(n)) ? '–' : (n*100).toFixed(d) + '%';
const fS = (n,d=1) => (n==null||!isFinite(n)) ? '–' : (n>=0?'+':'') + (n*100).toFixed(d) + '%';
const div = (a,b) => b ? a/b : null;
const shortD = s => { const d = dObj(s); return `${d.getUTCDate()} ${d.toLocaleString('en-US',{month:'short',timeZone:'UTC'})}`; };
const dayName = s => DOWN[dow(s)];
const sum = (arr,f) => arr.reduce((a,x)=>a+(f?f(x):x),0);
function paceCls(p,T){ if (p==null) return 'n'; if (p>=1) return 'g'; if (p>=T.pace_amber) return 'a'; return 'r'; }
function promoCls(p,T){ if (p==null) return 'n'; if (p>T.promo_over_red) return 'r'; if (p>T.promo_over_amber) return 'a'; if (p<T.promo_under) return 'a'; return 'g'; }
function cpdCls(p,T){ if (p==null) return 'n'; return p>T.cost_per_demand_amber ? 'r' : (p>1 ? 'a' : 'g'); }
function alignCell(spendPct, demandPct, T){ const r = div(spendPct, demandPct); if (r==null || spendPct==null) return '<td class="dim">–</td>'; const c = r<=1 ? 'g' : r<=T.cost_per_demand_amber ? 'a' : 'r'; const lbl = r<=1 ? 'on track' : r<=T.cost_per_demand_amber ? 'watch' : 'overspending'; return `<td class="st-${c}" title="Promo ${fP(spendPct,0)} of budget vs real demand ${fP(demandPct,1)} of target"><b>${fS(r-1,0)}</b> <span style="font-size:11px;font-weight:600">${lbl}</span></td>`; }
const heatColor = p => p==null ? '#E3E2E9' : p>=1.05 ? '#1C8E1C' : p>=1 ? '#4FA64F' : p>=0.95 ? '#EC7C01' : p>=0.9 ? '#D8560A' : '#C70010';

/* ---------- loading ---------- */
const MB_HOST = 'https://analytics.riden.app';
const ROUTE_OK = {};
const normRows = rows => rows.map(row => { const o = {}; for (const k in row) o[norm(k)] = row[k]; return o; });
function parseBody(txt, kind){
  const t = txt.trim();
  if (!t || t[0] === '<') throw new Error('got HTML, not data');
  if (kind === 'json' || t[0] === '[' || t[0] === '{') {
    const j = JSON.parse(t);
    if (Array.isArray(j)) return normRows(j);
    if (j && j.data && j.data.rows) { const cols = j.data.cols.map(c => c.name); return normRows(j.data.rows.map(r => Object.fromEntries(r.map((v,i)=>[cols[i], v])))); }
    throw new Error('unexpected JSON shape');
  }
  return normRows(Papa.parse(t, {header:true, skipEmptyLines:true}).data);
}
async function getCSV(url){
  if (!/^https?:/.test(url)) { const r = await fetch(url, {cache:'no-store'}); if (!r.ok) throw new Error(`HTTP ${r.status}`); return parseBody(await r.text(), 'csv'); }
  const m = url.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
  const id = m ? m[1] : null;
  const routes = id ? [
    ['proxy',    () => fetch(`mb/${id}`, {cache:'no-store'}), 'csv'],
    ['api-csv',  () => fetch(`${MB_HOST}/api/public/card/${id}/query/csv`), 'csv'],
    ['api-json', () => fetch(`${MB_HOST}/api/public/card/${id}/query/json`), 'json'],
    ['api-post', () => fetch(`${MB_HOST}/api/public/card/${id}/query/csv`, {method:'POST', body:new URLSearchParams({format_rows:'false'})}), 'csv'],
    ['link',     () => fetch(url), 'csv']
  ] : [['link', () => fetch(url), 'csv']];
  const known = ROUTE_OK[id]; if (known) routes.sort((a,b) => (b[0]===known) - (a[0]===known));
  const fails = [];
  for (const [name, go, kind] of routes) {
    try { const r = await go(); if (!r.ok) throw new Error(`HTTP ${r.status}`); const rows = parseBody(await r.text(), kind); ROUTE_OK[id] = name; console.info(`[data] ${id}: loaded via ${name} (${rows.length} rows)`); return rows; }
    catch(e) { fails.push(`${name}: ${e.message}`); }
  }
  console.warn(`[data] ${id} failed on every route`, fails);
  throw new Error('blocked by browser (CORS). Deploy on Cloudflare Pages with the functions folder, see README');
}
async function getTargets(){
  const r = await fetch(TFILE + (TFILE.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error(`${TFILE}: HTTP ${r.status}`);
  const wb = XLSX.read(await r.arrayBuffer(), {type:'array', cellDates:true});
  const sh = name => { const n = wb.SheetNames.find(s => norm(s) === norm(name)); return n ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null}) : null; };
  const table = (rows) => { if (!rows) return []; const h = rows[0].map(norm); return rows.slice(1).filter(r => r[0]!=null && String(r[0]).trim()!=='').map(r => { const o={}; h.forEach((k,i)=>{ if(k) o[k]=r[i]; }); return o; }); };
  const T = {pace_amber:.95,pace_red:.90,promo_over_amber:1.05,promo_over_red:1.15,promo_under:.80,cost_per_demand_amber:1.10,min_zone_demand_target:5000,min_zone_promo_budget:500,min_uni_target:500,never_completed_spike:1.2,uni_month_target:null,target_month:null,period_morning_start:6,period_afternoon_start:12,period_rush_start:16,period_evening_start:20,wow_demand_amber:-0.05,wow_demand_red:-0.10,unserved_rise_amber:1.15,unserved_zone_amber:0.10,min_zone_requesting_users:500,bad_rating_rise_amber:1.2,apple_fail_amber:0.15,card_fail_amber:0.07,churn_rise_amber:1.10,promo_min_window_days:7,promo_cost_per_user_flag:20};
  table(sh('Config')).forEach(r => { const k = norm(r.key); if (!(k in T)) return; T[k] = k==='target_month' ? (r.value instanceof Date ? `${r.value.getFullYear()}-${pad(r.value.getMonth()+1)}` : String(r.value).trim().slice(0,7)) : num(r.value); });
  const isTot = z => /^total$/i.test(String(z).trim());
  const zones = table(sh('Real Demand Target Day x Zone')).filter(r=>!isTot(r.zone_name)).map(r => ({zone:String(r.zone_name).trim(), total:num(r.total_target), dow:DOWN.map(d=>num(r[norm(d)]))}));
  const promo = table(sh('Promo Spend Zone x Day')).filter(r=>!isTot(r.zone)).map(r => ({zone:String(r.zone).trim(), total:num(r.total_spend_jd), dow:DOWN.map(d=>num(r[norm(d)])), cpd:num(r.promo_cost_per_real_demand)}));
  const unis = table(sh('Universities Targets')).filter(r=>!isTot(r.university)).map(r => ({uni:String(r.university).trim(), weekday:num(r.weekday_completed_trips), weekend:num(r.weekend_completed_trips), base_users:num(r.current_unique_users_month)}));
  const segs = {}; table(sh('Users Target')).filter(r=>!isTot(r.segment)).forEach(r => { segs[String(r.segment).trim()] = {demand:num(r.real_demand_traget ?? r.real_demand_target), per_user:num(r.planned_demand_user), users:num(r.segment_users_needed), promo:num(r.oct_promo_jod ?? r.promo_jod), ppd:num(r.promo_demand_jod)}; });
  const cal = {}; table(sh('Uni Calendar')).forEach(r => { const d = toISO(r.date); if (d) cal[d] = String(r.type||'').trim().toLowerCase(); });
  const curve = table(sh('User Pacing Curve')).map(r => ({d:toISO(r.trip_date), active:num(r.active), reactivated:num(r.reactivated), newreg:num(r.new_registered)+num(r.registered_and_activated), first:num(r.first_trip)})).filter(r=>r.d);
  const hrs = table(sh('Hour Weights')).filter(r => /^\d+$/.test(String(r.hour).trim()) && +r.hour >= 0 && +r.hour <= 23).sort((a,b)=>+a.hour - +b.hour).map(r => ({wd:num(r.weekday), we:num(r.weekend)}));
  const hours = hrs.length===24 ? hrs : [];
  return {T, zones, promo, unis, segs, cal, curve, hours};
}

async function loadAll(){
  const errs = [];
  const safe = (k,p) => p.catch(e => { errs.push(`${k}: ${e.message}`); return []; });
  const [tg, zone, segDaily, segMonthly, uni, funnel] = await Promise.all([
    getTargets().catch(e => { errs.push('Targets: ' + e.message); return null; }),
    safe('Daily Platform Metrics - By Zone', getCSV(SOURCES.zone)),
    safe('Daily Metric By Segment', getCSV(SOURCES.segDaily)),
    safe('Monthly Metric By Segment', getCSV(SOURCES.segMonthly)),
    safe('Universities Tracker', getCSV(SOURCES.uni)),
    safe('Users Segments Funnel', getCSV(SOURCES.funnel))
  ]);
  return {tg, zone, segDaily, segMonthly, uni, funnel, errs};
}

/* ---------- model ---------- */
function build(raw){
  const {tg} = raw; const T = tg.T;
  const todayReal = QS.get('asof') || ammanToday();
  const month = T.target_month || todayReal.slice(0,7);
  const [Y,M] = month.split('-').map(Number);
  const nDays = new Date(Date.UTC(Y,M,0)).getUTCDate();
  const dates = Array.from({length:nDays}, (_,i)=>`${month}-${pad(i+1)}`);
  const mStart = dates[0], mEnd = dates[nDays-1];
  const inMonth = d => d && d >= mStart && d <= mEnd;
  const liveDate = inMonth(todayReal) ? todayReal : null;
  let lastFull = todayReal > mEnd ? mEnd : addDays(todayReal,-1);
  if (lastFull < mStart) lastFull = null;
  const done = lastFull ? dates.filter(d => d <= lastFull) : [];
  const remaining = dates.filter(d => !lastFull || d > lastFull);

  /* daily target shapes, scaled so each zone sums to its monthly total */
  const shape = rows => { const out = {}; rows.forEach(z => { let raw = dates.map(d => z.dow[dow(d)]); if (!sum(raw) && z.total) raw = dates.map(()=>1); const s = sum(raw); out[z.zone] = {total:z.total, day:Object.fromEntries(dates.map((d,i)=>[d, s ? raw[i]*z.total/s : 0])), cpd:z.cpd}; }); return out; };
  const zT = shape(tg.zones), pT = shape(tg.promo);
  const platT = {}, platP = {}; dates.forEach(d => { platT[d] = sum(Object.values(zT), z=>z.day[d]); platP[d] = sum(Object.values(pT), z=>z.day[d]); });
  const rdMonth = sum(dates, d=>platT[d]), promoMonth = sum(dates, d=>platP[d]);

  /* segments: demand & promo follow platform day shape; users follow reference-month curve */
  const segT = {};
  const refN = tg.curve.length;
  const refKey = {'Active':'active','Reactivated':'reactivated','New Registered':'newreg','First Trip':'first'};
  const cumRef = {}; SEGS.forEach(s => { const k = refKey[s]; const tot = sum(tg.curve, r=>r[k]); let c = 0; cumRef[s] = [0, ...tg.curve.map(r => (c += r[k], tot ? c/tot : 0))]; });
  const curveAt = (s, n) => { if (!refN) return n/nDays; const x = n/nDays*refN; const lo = Math.floor(x), hi = Math.min(refN, lo+1); const a = cumRef[s][lo], b = cumRef[s][hi]; return a + (b-a)*(x-lo); };
  SEGS.forEach(s => { const t = tg.segs[s] || {demand:0,users:0,promo:0,ppd:0,per_user:0};
    segT[s] = {...t, day:Object.fromEntries(dates.map(d=>[d, rdMonth ? t.demand*platT[d]/rdMonth : 0])), pday:Object.fromEntries(dates.map(d=>[d, promoMonth ? t.promo*platP[d]/promoMonth : 0])), cumUsers:Object.fromEntries(dates.map((d,i)=>[d, t.users*curveAt(s,i+1)]))}; });

  /* universities */
  const calType = d => tg.cal[d] || ([5,6].includes(dow(d)) ? 'weekend' : 'teaching');
  const nTeach = dates.filter(d=>calType(d)==='teaching').length, nWknd = dates.filter(d=>calType(d)==='weekend').length;
  const uT = {}; tg.unis.forEach(u => { uT[u.uni] = {...u, total:u.weekday+u.weekend, day:Object.fromEntries(dates.map(d => { const t = calType(d); return [d, t==='teaching' ? (nTeach? u.weekday/nTeach:0) : t==='weekend' ? (nWknd? u.weekend/nWknd:0) : 0]; }))}; });
  const uniMonthT = T.uni_month_target || sum(Object.values(uT), u=>u.total);
  const uScale = sum(Object.values(uT), u=>u.total) ? uniMonthT / sum(Object.values(uT), u=>u.total) : 1;
  Object.values(uT).forEach(u => { u.total *= uScale; for (const d in u.day) u.day[d] *= uScale; });
  const uniDayT = Object.fromEntries(dates.map(d => [d, sum(Object.values(uT), u=>u.day[d])]));

  /* actuals */
  const zr = raw.zone.map(r => ({d:toISO(r.trip_date), zone:String(r.zone_name||'').trim(), rd:num(r.real_demand), comp:num(r.completed_trips), req:num(r.total_requests), promo:num(r.promo_spend), gmv:num(r.gmv), net:num(r.platform_net_revenue), users:num(r.unique_users), mtdUsers:num(r.mtd_unique_users)})).filter(r=>inMonth(r.d));
  const sr = raw.segDaily.map(r => ({d:toISO(r.trip_date), seg:String(r.user_segment||'').trim(), rd:num(r.real_demand), comp:num(r.completed_trips), promo:num(r.promo_spend), req_users:num(r.requesting_users), users:num(r.unique_users), unserved:num(r.unserved_users), gmv:num(r.gmv)})).filter(r=>inMonth(r.d));
  const ur = raw.uni.map(r => ({d:toISO(r.trip_date), uni:String(r.university||'').trim(), comp:num(r.total_completed), rd:num(r.total_real_demand), users:num(r.total_unique_users), mtdUsers:num(r.total_mtd_unique_users)})).filter(r=>inMonth(r.d));
  const fr = raw.funnel.map(r => ({d:toISO(r.trip_date), 'Active':num(r.active), 'Reactivated':num(r.reactivated), 'New Registered':num(r.new_registered)+num(r.registered_and_activated), 'First Trip':num(r.first_trip), total:num(r.total_users)})).filter(r=>inMonth(r.d));
  const sm = raw.segMonthly.map(r => ({m:toISO(r.month_start), seg:String(r.user_segment||'').trim(), req_users:num(r.requesting_users), users:num(r.unique_users), rd:num(r.real_demand)})).filter(r => r.m && r.m.slice(0,7)===month);

  const plat = {}; dates.forEach(d => plat[d] = {rd:0,comp:0,req:0,promo:0,gmv:0,net:0,users:0,newUsers:0,uni:0,has:false});
  zr.forEach(r => { const p = plat[r.d]; p.rd+=r.rd; p.comp+=r.comp; p.req+=r.req; p.promo+=r.promo; p.gmv+=r.gmv; p.net+=r.net; p.has=true; });
  sr.forEach(r => { if (r.seg!=='Never Completed') plat[r.d].users += r.users; });
  fr.forEach(r => plat[r.d].newUsers += r.total);
  ur.forEach(r => plat[r.d].uni += r.comp);
  const dataMax = zr.length ? zr.reduce((a,r)=>r.d>a?r.d:a, zr[0].d) : null;

  return {T, hours:tg.hours||[], month, dates, nDays, mStart, mEnd, todayReal, liveDate, lastFull, done, remaining, zT, pT, platT, platP, rdMonth, promoMonth, segT, uT, uniMonthT, uniDayT, calType, nTeach, zr, sr, ur, fr, sm, plat, dataMax};
}

/* aggregate helpers on model */
function mtd(M, f, ds){ return sum(ds || M.done, f); }
function projection(actual, tgtDone, tgtMonth){ const p = div(actual,tgtDone); return p==null ? null : actual + (tgtMonth - tgtDone)*p; }

/* ---------- alerts ---------- */
function computeAlerts(M){
  const A = [], T = M.T; if (!M.done.length) return A;
  const y = M.lastFull;
  const add = (cat, sev, title, detail, value, vlabel) => A.push({cat, sev, title, detail, value, vlabel});
  const sevOf = p => p < T.pace_red ? 'red' : p < T.pace_amber ? 'amber' : null;

  /* Real demand: platform */
  const rdA = mtd(M, d=>M.plat[d].rd), rdT = mtd(M, d=>M.platT[d]);
  const rdP = div(rdA, rdT); const proj = projection(rdA, rdT, M.rdMonth);
  if (rdP!=null && sevOf(rdP)) add('Real demand', sevOf(rdP), 'Platform real demand behind pace', `MTD ${fI(rdA)} vs paced ${fI(rdT)}. Month-end projection ${fI(proj)} vs target ${fI(M.rdMonth)} (gap ${fI(M.rdMonth-proj)}).`, fP(rdP,1), 'of pace');
  const yP = div(M.plat[y].rd, M.platT[y]);
  if (yP!=null && sevOf(yP)) add('Real demand', sevOf(yP), `Yesterday (${dayName(y)} ${shortD(y)}) below daily target`, `${fI(M.plat[y].rd)} real demand vs target ${fI(M.platT[y])}.`, fP(yP,1), 'of target');
  if (M.remaining.length) { const need = (M.rdMonth - rdA)/M.remaining.length, plan = sum(M.remaining, d=>M.platT[d])/M.remaining.length; const lift = need/plan - 1; if (lift > 0.05) add('Real demand', lift>0.15?'red':'amber', 'Required run-rate above plan', `Need ${fI(need)}/day for the remaining ${M.remaining.length} days vs plan average ${fI(plan)}/day.`, fS(lift,1), 'above plan'); }

  /* zones */
  Object.entries(M.zT).forEach(([z,t]) => {
    if (t.total < T.min_zone_demand_target) return;
    const a = sum(M.zr.filter(r=>r.zone===z && r.d<=y), r=>r.rd), tt = sum(M.done, d=>t.day[d]); const p = div(a,tt);
    let streak = 0; for (let i = M.done.length-1; i>=0; i--) { const d = M.done[i]; const ad = sum(M.zr.filter(r=>r.zone===z && r.d===d), r=>r.rd); if (ad < t.day[d]) streak++; else break; }
    if (p!=null && sevOf(p)) add('Real demand', sevOf(p), `${z}: real demand behind pace`, `MTD ${fI(a)} vs paced ${fI(tt)} (gap ${fI(tt-a)}).${streak>=3?` Below daily target ${streak} days in a row.`:''}`, fP(p,1), 'of pace');
    else if (streak >= 3) add('Real demand', 'amber', `${z}: ${streak} days in a row below target`, `MTD still ${fP(p,1)} of pace, but the trend is slipping.`, streak+'d', 'streak');
  });
  /* segments */
  SEGS.forEach(s => {
    const t = M.segT[s]; if (!t.demand) return;
    const a = sum(M.sr.filter(r=>r.seg===s && r.d<=y), r=>r.rd), tt = sum(M.done, d=>t.day[d]); const p = div(a,tt);
    if (p!=null && sevOf(p)) add('Real demand', sevOf(p), `${s} segment: real demand behind pace`, `MTD ${fI(a)} vs paced ${fI(tt)}.`, fP(p,1), 'of pace');
    const ua = sum(M.fr.filter(r=>r.d<=y), r=>r[s]), ut = t.cumUsers[y]; const up = div(ua,ut);
    if (up!=null && sevOf(up)) add('Real demand', sevOf(up), `${s} segment: fewer users than needed`, `${fI(ua)} completing users MTD vs ${fI(ut)} expected by now (month need ${fI(t.users)}).`, fP(up,1), 'of pace');
  });
  /* never completed */
  const nc = M.done.map(d => sum(M.sr.filter(r=>r.seg==='Never Completed' && r.d===d), r=>r.req_users));
  if (nc.length >= 8) { const last = nc[nc.length-1], avg = sum(nc.slice(-8,-1))/7; if (avg && last/avg > T.never_completed_spike) add('Real demand','amber','Never Completed users spiked yesterday', `${fI(last)} requesting users with no completed trip vs 7-day average ${fI(avg)}.`, fS(last/avg-1,0), 'vs 7d avg'); }

  /* Promo */
  const pA = mtd(M, d=>M.plat[d].promo), pTt = mtd(M, d=>M.platP[d]); const pp = div(pA,pTt);
  if (pp!=null) {
    if (pp > T.promo_over_amber) add('Promo spend', pp>T.promo_over_red?'red':'amber', 'Platform promo overspending', `MTD ${fJ(pA)} JD vs paced budget ${fJ(pTt)} JD. At this rate month-end spend ≈ ${fJ(pA/pTt*M.promoMonth)} JD vs ${fJ(M.promoMonth)} JD budget.`, fP(pp,0), 'of budget pace');
    else if (pp < T.promo_under) add('Promo spend', 'amber', 'Platform promo underspending', `MTD ${fJ(pA)} JD vs paced ${fJ(pTt)} JD. Unused budget can be redirected to zones behind on demand.`, fP(pp,0), 'of budget pace');
    const cpd = div(pA, rdA), cpdT = div(M.promoMonth, M.rdMonth);
    if (cpd && cpdT && cpd/cpdT > T.cost_per_demand_amber) add('Promo spend','amber','Promo cost per real demand above target', `${fJ(cpd,3)} JD per real demand vs target ${fJ(cpdT,3)} JD.`, fS(cpd/cpdT-1,0), 'vs target');
    if (pp >= 1 && rdP!=null && rdP < T.pace_amber) add('Promo spend','red','Spending on pace but demand is not', `Promo at ${fP(pp,0)} of budget pace while real demand is at ${fP(rdP,1)} of pace.`, fP(rdP,0), 'demand pace');
  }
  Object.entries(M.pT).forEach(([z,t]) => {
    if (t.total < T.min_zone_promo_budget) return;
    const a = sum(M.zr.filter(r=>r.zone===z && r.d<=y), r=>r.promo), tt = sum(M.done, d=>t.day[d]); const p = div(a,tt);
    const za = sum(M.zr.filter(r=>r.zone===z && r.d<=y), r=>r.rd); const cpd = div(a, za);
    if (p!=null && p > T.promo_over_amber) add('Promo spend', p>T.promo_over_red?'red':'amber', `${z}: promo overspending`, `MTD ${fJ(a)} JD vs paced ${fJ(tt)} JD.`, fP(p,0), 'of budget pace');
    else if (p!=null && p < T.promo_under) add('Promo spend', 'amber', `${z}: promo underspending`, `MTD ${fJ(a)} JD vs paced ${fJ(tt)} JD.`, fP(p,0), 'of budget pace');
    if (cpd && t.cpd && cpd/t.cpd > T.cost_per_demand_amber) add('Promo spend','amber', `${z}: cost per real demand above target`, `${fJ(cpd,3)} JD vs target ${fJ(t.cpd,3)} JD.`, fS(cpd/t.cpd-1,0), 'vs target');
  });
  SEGS.forEach(s => { const t = M.segT[s]; if (!t.promo) return;
    const a = sum(M.sr.filter(r=>r.seg===s && r.d<=y), r=>r.promo), tt = sum(M.done, d=>t.pday[d]); const p = div(a,tt);
    const ra = sum(M.sr.filter(r=>r.seg===s && r.d<=y), r=>r.rd); const cpd = div(a,ra);
    if (p!=null && p > T.promo_over_amber) add('Promo spend', p>T.promo_over_red?'red':'amber', `${s} segment: promo overspending`, `MTD ${fJ(a)} JD vs paced ${fJ(tt)} JD.`, fP(p,0), 'of budget pace');
    if (cpd && t.ppd && cpd/t.ppd > T.cost_per_demand_amber) add('Promo spend','amber', `${s} segment: promo per real demand above target`, `${fJ(cpd,3)} JD vs target ${fJ(t.ppd,3)} JD.`, fS(cpd/t.ppd-1,0), 'vs target');
  });

  /* Universities */
  const ua = mtd(M, d=>M.plat[d].uni), ut = mtd(M, d=>M.uniDayT[d]);
  if (ut > 0) { const p = ua/ut; if (sevOf(p)) add('Universities', sevOf(p), 'University completed trips behind pace', `MTD ${fI(ua)} vs paced ${fI(ut)}; month target ${fI(M.uniMonthT)}.`, fP(p,1), 'of pace'); }
  if (M.calType(y)==='teaching' && M.uniDayT[y] > 0) { const p = M.plat[y].uni/M.uniDayT[y]; if (sevOf(p)) add('Universities', sevOf(p), `Yesterday's teaching day below target`, `${fI(M.plat[y].uni)} completed vs ${fI(M.uniDayT[y])}.`, fP(p,1), 'of target'); }
  Object.values(M.uT).forEach(u => { if (u.total < T.min_uni_target) return; const tt = sum(M.done, d=>u.day[d]); if (tt <= 0) return;
    const a = sum(M.ur.filter(r=>r.uni===u.uni && r.d<=y), r=>r.comp); const p = a/tt;
    if (sevOf(p)) add('Universities', sevOf(p), `${u.uni} behind pace`, `MTD ${fI(a)} completed vs paced ${fI(tt)} (month ${fI(u.total)}).`, fP(p,1), 'of pace'); });

  const rank = {red:0, amber:1};
  return A.sort((a,b) => rank[a.sev]-rank[b.sev]);
}

/* ---------- rendering helpers ---------- */
function kill(id){ if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
function chart(id, cfg){ kill(id); const el = document.getElementById(id); if (!el) return; charts[id] = new Chart(el, cfg); }
Chart.defaults.font.family = "'Montserrat', system-ui, sans-serif"; Chart.defaults.font.size = 11.5; Chart.defaults.color = '#464555';
Chart.defaults.plugins.legend.labels.boxWidth = 12; Chart.defaults.maintainAspectRatio = false;
const gridY = {grid:{color:'#EEEDF2'}, border:{display:false}, ticks:{callback:v=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':v}};
const gridX = {grid:{display:false}, border:{color:'#E3E2E9'}};
function kpi(label, value, sub, pct, cls){ const w = pct==null ? 0 : Math.min(100, pct*100); return `<div class="panel kpi"><div class="k-l">${label}</div><div class="k-v">${value}</div>${pct!=null?`<div class="bar"><i class="bg-${cls}" style="width:${w}%"></i></div>`:''}<div class="k-s">${sub}</div></div>`; }
const pctSpan = (p,cls) => `<b class="st-${cls}">${fP(p,1)}</b>`;
function head(title, sub){ return `<h2>${title}</h2><hr class="sep">${sub?`<div class="sub">${sub}</div>`:''}`; }
function noFull(M){ return `<div class="panel empty">No full day of ${monthLabel(M)} yet. The first full day is available tomorrow; see <b>Today live</b> for the current day.</div>`; }
const monthLabel = M => new Date(Date.UTC(+M.month.slice(0,4), +M.month.slice(5,7)-1, 1)).toLocaleString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});

/* ---------- tabs ---------- */
function rOverview(M, A){

  const need = M.remaining.length ? (M.rdMonth-rdA)/M.remaining.length : 0, plan = M.remaining.length ? sum(M.remaining,d=>M.platT[d])/M.remaining.length : 0;

  const uA = mtd(M,d=>M.plat[d].uni), uT = mtd(M,d=>M.uniDayT[d]);

  </div>

  <div class="grid g3">

    ${kpi('Completed trips MTD', fI(cmp), `Real demand converted: <b>${fP(div(cmp,rdA),1)}</b> · yesterday ${fI(M.plat[y].comp)}`, null)}
    ${kpi('Promo spend MTD (JD)', fJ(pA), `Paced budget ${fJ(pT)} · ${pctSpan(div(pA,pT),promoCls(div(pA,pT),T))} · ${fJ(cpd,3)} JD per demand (target ${fJ(cpdT,3)})`, div(pA,pT), promoCls(div(pA,pT),T))}

    ${kpi('GMV / net revenue MTD (JD)', fJ(gmv), `Net revenue ${fJ(net)} JD · no target set`, null)}
  </div>

  ${A.length ? A.slice(0,5).map(alertHTML).join('') : '<div class="panel empty">Everything is on pace.</div>'}

/* ---------- periods ---------- */
function periodDefs(T){
  const b = [0, T.period_morning_start, T.period_afternoon_start, T.period_rush_start, T.period_evening_start, 24];
  const names = ['After midnight','Morning','Afternoon','Rush','Evening'];
  return names.map((n,i) => ({n, from:b[i], to:b[i+1], label:`${pad(b[i])}–${pad(b[i+1]===24?24:b[i+1])}`}));
}
const isWknd = d => [5,6].includes(dow(d));
function hourW(hours, d){ const k = isWknd(d) ? 'we' : 'wd'; return hours.length===24 ? hours.map(h=>h[k]) : Array(24).fill(1/24); }
function cumShareAt(hours, d, hh, mm){ const w = hourW(hours,d); let s = 0; for (let h=0; h<hh; h++) s += w[h]; return s + w[hh]*(mm/60); }

/* ---------- Today live: hourly pace panel ---------- */
function livePacePanel(M){
  const d = M.liveDate; if (!d) return '';
  const hours = M.hours; const T = M.T;
  const wc = ready('wow') ? (X.wow.rows[0]||{}).cutoff_time : null;
  const now = ammanTime(); const tStr = wc && /^\d{1,2}:\d{2}/.test(String(wc)) ? String(wc).slice(0,5) : now;
  const [hh, mm] = tStr.split(':').map(Number);
  const share = cumShareAt(hours, d, hh, mm); const tRD = M.platT[d]; const exp = tRD*share; const act = M.plat[d].rd; const p = div(act, exp);
  const P = periodDefs(T); const w = hourW(hours, d);
  const dh = ready('dayHour') ? normDH(X.dayHour.rows).filter(r=>r.d===d) : [];
  const byH = Array(24).fill(0); dh.forEach(r => byH[r.h] += r.rd);
  const scale = sum(byH) ? act/sum(byH) : 1;
  const prow = P.map(x => { const ws = sum(w.slice(x.from,x.to)); const tgt = tRD*ws; const a = sum(byH.slice(x.from,x.to))*scale;
    const state = hh >= x.to ? 'done' : hh >= x.from ? 'now' : 'next';
    const expNow = state==='done' ? tgt : state==='now' ? tRD*(sum(w.slice(x.from,hh)) + w[hh]*mm/60) : 0;
    return {...x, tgt, a, state, expNow, p:state==='next'?null:div(a,expNow)}; });
  return `
  ${head('Pace against the hourly curve', `Expected share of today's target by ${tStr} (${isWknd(d)?'weekend':'weekday'} curve, Hour Weights sheet) = <b>${fP(share,1)}</b>. ${wc?'Clock = time of the latest completed trip, so data lag is not counted as a miss.':'Clock = current Amman time.'}`)}

      ${prow.map(r=>`<tr><td>${r.n}${r.state==='now'?' <span class="live-dot"></span>':''}</td><td>${r.label}</td><td>${fI(r.tgt)}</td><td>${r.state==='next'?'<span class="dim">–</span>':fI(r.a)}</td><td>${r.state==='next'?'<span class="dim">later</span>':fI(r.expNow)}</td><td class="st-${paceCls(r.p,T)}"><b>${fP(r.p,1)}</b></td></tr>`).join('')}

    ${kpi('Completed trips', fI(cNow), `Completion ${fP(div(cNow,done(tH,'req')),1)} of requests · last week ${fI(cLW)} ${vs(cNow,cLW)}`, null)}
    ${kpi('Promo spend (JD)', fJ(pNow), `${pExp!=null?`Budget so far ${fJ(pExp)} · <b>${fP(div(pNow,pExp),0)}</b> · `:''}last week ${fJ(pLW)} ${vs(pNow,pLW)} · ${fJ(div(pNow,rdNow),3)} JD per demand`, pExp!=null?div(pNow,pExp):null, promoCls(div(pNow,pExp),T))}
    ${kpi('University completed', fI(uNow), `${uExp!=null?`Expected ${fI(uExp)} · <b>${fP(div(uNow,uExp),0)}</b> · `:''}last week ${fI(uLW)} ${vs(uNow,uLW)}`, uExp?div(uNow,uExp):null, paceCls(uExp?div(uNow,uExp):null,T))}
    ${kpi('GMV / net revenue (JD)', fJ(gNow), `Net ${fJ(nNow)} · last week GMV ${fJ(gLW)} ${vs(gNow,gLW)}, net ${fJ(nLW)} ${vs(nNow,nLW)}`, null)}
    ${kpi(`Current hour ${pad(ch)}:00 (${cm} min in)`, fI(cur.rd), `${hT(ch)!=null?`Expected so far ${fI(hT(ch)*frac)} · `:''}last week same minutes ${fI(curLW.rd*frac)} ${vs(cur.rd,curLW.rd*frac)} · completion ${fP(div(cur.comp,cur.req),1)}`, null)}
  </div>
  <div class="panel" style="margin-top:14px"><div class="seg-h"><h3>Real demand by hour: ${filt}</h3></div><div class="chartbox"><canvas id="cHourly"></canvas></div></div>
  ${head('Hour by hour', 'Current hour shown as is (partial); its attainment is against the minutes elapsed. Acceptance = requests with an accepted dispatch.')}
  <div class="panel tw"><table><thead><tr><th>Hour</th><th>Target</th><th>Real demand</th><th>Attain.</th><th>Yesterday</th><th>Last week</th><th>vs LW</th><th>Completed</th><th>Completion</th><th>Acceptance</th><th>Rider cancel</th><th>Driver cancel</th><th>No driver</th><th>Promo JD</th><th>JD / demand</th><th>GMV JD</th><th>Uni</th></tr></thead><tbody>
  ${hrs.filter(h=>h<=ch).reverse().map(h => { const t = tH[h], l = lH[h], y = yH[h]; const isCur = h===ch; const tg = hT(h); const att = tg ? div(t.rd, isCur ? tg*frac : tg) : null; const lwc = isCur ? l.rd*frac : l.rd;
    return `<tr><td>${pad(h)}:00${isCur?' <span class="live-dot"></span>':''}</td><td>${tg!=null?fI(tg):'–'}</td><td><b>${fI(t.rd)}</b></td><td class="st-${paceCls(att,T)}">${fP(att,0)}</td><td>${fI(y.rd)}</td><td>${fI(l.rd)}</td><td class="${upGood(chg(t.rd,lwc))}">${fS(chg(t.rd,lwc),1)}</td><td>${fI(t.comp)}</td><td>${fP(div(t.comp,t.req),1)}</td><td>${fP(div(t.acc,t.req),1)}</td><td>${fI(t.cu)}</td><td>${fI(t.cd)}</td><td class="${t.ndf>0?'st-r':''}">${fI(t.ndf)}</td><td>${fJ(t.promo)}</td><td>${fJ(div(t.promo,t.rd),3)}</td><td>${fJ(t.gmv)}</td><td>${fI(t.uni)}</td></tr>`; }).join('')}
  <tr class="tot"><td>Today so far</td><td>${rdExp!=null?fI(rdExp):'–'}</td><td>${fI(rdNow)}</td><td>${fP(div(rdNow,rdExp),1)}</td><td>${fI(rdY)}</td><td>${fI(rdLW)}</td><td>${fS(chg(rdNow,rdLW),1)}</td><td>${fI(cNow)}</td><td>${fP(div(cNow,done(tH,'req')),1)}</td><td>${fP(div(done(tH,'acc'),done(tH,'req')),1)}</td><td>${fI(done(tH,'cu'))}</td><td>${fI(done(tH,'cd'))}</td><td>${fI(done(tH,'ndf'))}</td><td>${fJ(pNow)}</td><td>${fJ(div(pNow,rdNow),3)}</td><td>${fJ(gNow)}</td><td>${fI(uNow)}</td></tr>
  </tbody></table></div>
  ${head('Zones by hour', inMonth ? `Real demand ÷ the zone's hourly target. Zones with a monthly target of at least ${fI(T.min_zone_demand_target)}. Current hour against minutes elapsed.` : 'Real demand ÷ the same hour last week (no target loaded).')}
  <div class="panel tw"><table class="heat"><thead><tr><th style="text-align:left">Zone</th>${hrs.filter(h=>h<=ch).map(h=>`<th>${pad(h)}</th>`).join('')}</tr></thead><tbody>
  ${zones.filter(z => inMonth ? (M.zT[z] && M.zT[z].total >= T.min_zone_demand_target) : sum(R.filter(r=>r.z===z && r.lab==='last_week'),r=>r.rd) >= 500).map(z => `<tr><td>${z}</td>${hrs.filter(h=>h<=ch).map(h => { const f = h===ch ? frac : 1;
      const a = sum(R.filter(r=>r.z===z && r.lab==='today' && r.h===h && (HSEG==='All'||r.s===HSEG)), r=>r.rd);
      const base = inMonth ? M.zT[z].day[today]*w[h]*f : sum(R.filter(r=>r.z===z && r.lab==='last_week' && r.h===h && (HSEG==='All'||r.s===HSEG)), r=>r.rd)*f;
      const p = div(a, base); return `<td style="background:${heatColor(p)}" title="${z} ${pad(h)}:00: ${fI(a)} / ${fI(base)}">${p==null?'':Math.round(p*100)}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div>
  ${head('Segments by hour', 'Real demand per segment, today. Never Completed = requesting users who have never completed a trip.')}
  <div class="panel tw"><table><thead><tr><th>Segment</th>${hrs.filter(h=>h<=ch).map(h=>`<th>${pad(h)}</th>`).join('')}<th>Total</th><th>Completion</th><th>Promo JD</th><th>vs LW (same time)</th></tr></thead><tbody>
  ${segs.map(s => { const rs = R.filter(r=>r.s===s && (HZONE==='All'||r.z===HZONE)); const at = h => sum(rs.filter(r=>r.lab==='today'&&r.h===h),r=>r.rd); const tot = sum(rs.filter(r=>r.lab==='today'),r=>r.rd);
      const lwS = sum(rs.filter(r=>r.lab==='last_week' && r.h<ch),r=>r.rd) + sum(rs.filter(r=>r.lab==='last_week' && r.h===ch),r=>r.rd)*frac;
      const comp = sum(rs.filter(r=>r.lab==='today'),r=>r.comp), req = sum(rs.filter(r=>r.lab==='today'),r=>r.req);
      return `<tr><td${s==='Never Completed'?' class="st-r"':''}>${s}</td>${hrs.filter(h=>h<=ch).map(h=>`<td>${fI(at(h))}</td>`).join('')}<td><b>${fI(tot)}</b></td><td>${fP(div(comp,req),1)}</td><td>${fJ(sum(rs.filter(r=>r.lab==='today'),r=>r.promo))}</td><td class="${upGood(chg(tot,lwS))}">${fS(chg(tot,lwS),1)}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  const zs = document.getElementById('hZone'); if (zs) zs.onchange = () => { HZONE = zs.value; rHourly(M); };
  const ss = document.getElementById('hSeg'); if (ss) ss.onchange = () => { HSEG = ss.value; rHourly(M); };
  chart('cHourly', {data:{labels:hrs.map(h=>pad(h)+':00'), datasets:[
    ...(dayRD!=null ? [{type:'line', label:'Target', data:hrs.map(h=>hT(h)), borderColor:C.orange, borderWidth:2, borderDash:[5,4], pointRadius:0}] : []),
    {type:'line', label:`Last week (${shortD(lw)})`, data:lH.map(x=>x.rd), borderColor:C.granite, borderWidth:2, pointRadius:0},
    {type:'line', label:`Yesterday (${shortD(yday)})`, data:yH.map(x=>x.rd), borderColor:C.silver, borderWidth:2, pointRadius:0},
    {type:'bar', label:'Today', data:tH.map((x,h)=>h<=ch?x.rd:null), backgroundColor:hrs.map(h=>h===ch?'rgba(4,60,161,.45)':C.blue), borderRadius:3}
  ]}, options:{interaction:{mode:'index',intersect:false}, plugins:{legend:{position:'top',align:'end'}, tooltip:{callbacks:{label:x=>`${x.dataset.label}: ${fI(x.raw)}`}}}, scales:{x:{...gridX,ticks:{maxTicksLimit:12}}, y:gridY}}});
}

/* ---------- alerts from diagnostics ---------- */
function extraAlerts(M){
  const A = [], T = M.T; const cat = 'Service & retention';
  const add = (sev, title, detail, value, vlabel) => A.push({cat, sev, title, detail, value, vlabel});
  try {
    if (ready('wow') && X.wow.rows.length) { const R = wowData(); const t = sum(R,r=>r.t), l = sum(R,r=>r.l); const c = chg(t,l);
      if (c!=null && c < T.wow_demand_amber) add(c < T.wow_demand_red ? 'red':'amber', 'Real demand below the same time last week', `${fI(t)} today up to ${String(R[0].cut||'').slice(0,5)} vs ${fI(l)} last week.`, fS(c,1), 'vs last week'); }
    if (ready('unserved')) { const {tot, by} = unservedModel(); const c = tot(by('current_mtd')), p = tot(by('prev_mtd'));
      if (c.pct && p.pct && c.pct/p.pct > T.unserved_rise_amber) add('amber', 'Unserved users up vs last month', `${fP(c.pct,2)} of requesting users unserved MTD vs ${fP(p.pct,2)}; ${fJ(c.lg)} JD GMV lost so far.`, fS(c.pct/p.pct-1,0), 'vs last month');
      [...new Set(by('current_mtd').map(r=>r.z))].forEach(z => { const a = tot(by('current_mtd').filter(r=>r.z===z)); if (a.req >= T.min_zone_requesting_users && a.pct > T.unserved_zone_amber) add('amber', `${z}: high unserved share`, `${fI(a.un)} of ${fI(a.req)} requesting users unserved MTD; ${fJ(a.lg)} JD GMV lost.`, fP(a.pct,1), 'unserved'); }); }
    if (ready('ratings')) { const {today, cm, pm, dn} = calCtx(); const S1 = X.ratings.rows.filter(r=>r.row_type==='summary').map(r=>({d:toISO(r.trip_date), rated:num(r.rated_trips), bad:num(r.bad_ratings)}));
      const a = S1.filter(r=>r.d && ymOf(r.d)===cm && r.d<today), b = S1.filter(r=>r.d && ymOf(r.d)===pm && dnum(r.d)<dn); const ra = div(sum(a,r=>r.bad),sum(a,r=>r.rated)), rb = div(sum(b,r=>r.bad),sum(b,r=>r.rated));
      if (ra && rb && ra/rb > T.bad_rating_rise_amber) add('amber', 'Bad-rating rate up vs last month', `${fP(ra,2)} of rated trips got 1–3 stars MTD vs ${fP(rb,2)} last month.`, fS(ra/rb-1,0), 'vs last month'); }
    if (ready('payments')) { const {cur, agg, failRate} = payModel(); const ap = failRate(agg(cur,['Apple Pay'])), cd = failRate(agg(cur,['Card']));
      if (ap!=null && ap > T.apple_fail_amber) add('amber', 'Apple Pay failure rate high', `${fP(ap,1)} of Apple Pay charge attempts failed MTD (alert above ${fP(T.apple_fail_amber,0)}).`, fP(ap,1), 'failed');
      if (cd!=null && cd > T.card_fail_amber) add('amber', 'Card failure rate high', `${fP(cd,1)} of card charge attempts failed MTD.`, fP(cd,1), 'failed'); }
    if (ready('churn')) { const {R, inCur, inPrvSame} = churnModel(); const a = R.filter(r=>r.o==='churned' && inCur(r)), b = R.filter(r=>r.o==='churned' && inPrvSame(r));
      const pa = div(sum(a,r=>r.n), new Set(a.map(r=>r.cd)).size), pb = div(sum(b,r=>r.n), new Set(b.map(r=>r.cd)).size);
      if (pa && pb && pa/pb > T.churn_rise_amber) add('amber', 'Churn running above last month', `${fI(pa)} users churning per day MTD vs ${fI(pb)} last month.`, fS(pa/pb-1,0), 'vs last month'); }
  } catch(e){ console.warn('extra alerts', e); }
  return A;
}
function allAlerts(){ const A = S.A.concat(extraAlerts(S.M)); const rank = {red:0, amber:1}; return A.sort((a,b)=>rank[a.sev]-rank[b.sev]); }
function updateBadge(){ if (!S) return; const A = allAlerts(); const reds = A.filter(a=>a.sev==='red').length, badge = document.getElementById('alertBadge'); badge.textContent = A.length; badge.classList.toggle('hide', !A.length); badge.style.background = reds ? '' : '#EC7C01'; }

/* ---------- orchestration ---------- */
function renderAll(){
  if (!S) return; const {M, errs} = S; const A = allAlerts();
  const B = [];
  if (errs.length) B.push(`<div class="banner err">Some data could not load: ${errs.join(' | ')}. Showing what is available.</div>`);
  if (M.todayReal.slice(0,7) !== M.month) B.push(`<div class="banner warn">Targets are for ${monthLabel(M)} but today is ${M.todayReal}. Update <b>target_month</b> and the target tables in Targets.xlsx.</div>`);
  if (M.dataMax && M.dataMax.slice(0,7) !== M.month) B.push(`<div class="banner warn">Metabase data ends ${M.dataMax}, outside ${monthLabel(M)}.</div>`);
  else if (!M.zr.length) B.push(`<div class="banner info">No ${monthLabel(M)} rows returned by Metabase yet.</div>`);
  document.getElementById('banners').innerHTML = B.join('');
  document.getElementById('subtitle').textContent = `Demand & growth tracker, ${monthLabel(M)}`;
  updateBadge();
  const fns = {overview:()=>rOverview(M,A), live:()=>rLive(M), hourly:()=>rHourly(M), daily:()=>rDaily(M), weekly:()=>rWeekly(M), zones:()=>rZones(M), segments:()=>rSegments(M), unis:()=>rUnis(M), alerts:()=>rAlerts(M,A),
    wow:()=>rWow(M), periods:()=>rPeriods(M), eta:()=>rEta(M), unserved:()=>rUnserved(M), ratings:()=>rRatings(M), payments:()=>rPayments(M), churn:()=>rChurn(M), risk:()=>rRisk(M), promoroi:()=>rPromoRoi(M)};
  Object.keys(charts).forEach(kill);
  try { fns[TAB](); } catch(e){ console.error(e); document.getElementById('tab-'+TAB).innerHTML = `<div class="banner err">Could not draw this page: ${e.message}</div>`; }
}
async function refresh(force){
  const btn = document.getElementById('refreshBtn'); btn.disabled = true; btn.textContent = 'Refreshing…';
  try {
    const raw = await loadAll();
    if (!raw.tg) { document.getElementById('banners').innerHTML = `<div class="banner err">Targets could not load: ${raw.errs.join(' | ')}. Keep ${TFILE} next to index.html.</div>`; if (!S) document.getElementById('tab-overview').innerHTML = ''; }
    else { const M = build(raw); S = {M, A:computeAlerts(M), errs:raw.errs}; lastLoad = new Date(); renderAll(); loadExtras(force===true); }
  } catch(e){ console.error(e); document.getElementById('banners').innerHTML = `<div class="banner err">Refresh failed: ${e.message}</div>`; }
  btn.disabled = false; btn.textContent = 'Refresh now'; nextAt = Date.now() + REFRESH_MS; tick();
}
function tick(){ if (!lastLoad) return; const t = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Amman',hour:'2-digit',minute:'2-digit'}).format(lastLoad); const m = Math.max(0, Math.ceil((nextAt-Date.now())/60000)); document.getElementById('freshTxt').innerHTML = `Updated <b>${t}</b> Amman time · data through ${S&&S.M?S.M.dataMax||'–':'–'} · next refresh in ${m} min`; }
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; TAB = b.dataset.tab; document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on', x===b)); document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hide', s.id !== 'tab-'+TAB)); renderAll(); });
document.getElementById('refreshBtn').onclick = () => refresh(true);
refresh(); setInterval(refresh, REFRESH_MS); setInterval(() => tick(), 30000);
</script>
